<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The UAP Index</title>
    <meta
      name="description"
      content="A searchable index for UAP and UFO records, releases, and source material."
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/foundation-sites@6.9.0/dist/css/foundation.min.css"
    />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <header class="grid-container">
      <div class="grid-x grid-padding-x align-middle">
        <div class="cell">
          <h1>The UAP Index</h1>
          <p class="lead">
            A static archive for official UAP and UFO releases, documents, and
            source material.
          </p>
        </div>
      </div>
    </header>

    <main class="grid-container">
      <section class="grid-x grid-padding-x">
        <div class="cell medium-8 large-7">
          <div class="callout primary">
            <h2>Project Scaffold Ready</h2>
            <p>
              Foundation CSS is loaded. Data, asset, script, and style
              directories are in place for the next phase of the build.
            </p>
          </div>
        </div>
      </section>
    </main>

    <script src="scripts/main.js"></script>
  </body>
</html>
